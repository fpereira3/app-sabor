<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del local · SaborMap</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/componentes.css">
<link rel="stylesheet" href="local.css">
</head>
<body class="panel">
<a class="panel-saltar" href="#contenido">Saltar al contenido</a>

<div class="panel-app">
  <!-- Menú lateral (pantallas anchas) -->
  <aside class="panel-lateral" aria-label="Menú del panel">
    <a class="panel-marca" href="#inicio">
      <span data-icono="logo" data-tamano="28"></span>
      <span class="panel-marca__textos">
        <span class="panel-marca__nombre">SaborMap</span>
        <span class="panel-marca__sub">Panel del local</span>
      </span>
    </a>

    <div class="panel-local" id="lateral-local"></div>

    <nav aria-label="Secciones">
      <ul class="panel-menu">
        <li><a href="#inicio" data-ruta="inicio"><span data-icono="inicio"></span>Inicio</a></li>
        <li><a href="#carta" data-ruta="carta"><span data-icono="carta"></span>Carta</a></li>
        <li><a href="#ingredientes" data-ruta="ingredientes"><span data-icono="ingredientes"></span>Ingredientes<span class="panel-cuenta" data-cuenta="ingredientes" hidden></span></a></li>
        <li><a href="#promociones" data-ruta="promociones"><span data-icono="promociones"></span>Promociones</a></li>
        <li><a href="#local" data-ruta="local"><span data-icono="local"></span>Información del local</a></li>
      </ul>
    </nav>

    <div class="panel-lateral__pie">
      <a class="sm-btn sm-btn--borde" href="../comensal/restaurante.html"><span data-icono="eye" data-tamano="18"></span>Ver como comensal</a>
      <button type="button" class="sm-btn sm-btn--texto sm-btn--chico" data-accion="restablecer"><span data-icono="refresh" data-tamano="16"></span>Restablecer datos de prueba</button>
    </div>
  </aside>

  <!-- Cabecera (teléfono) -->
  <header class="panel-cabecera">
    <a class="panel-marca" href="#inicio">
      <span data-icono="logo" data-tamano="24"></span>
      <span class="panel-marca__textos">
        <span class="panel-marca__nombre">SaborMap</span>
        <span class="panel-marca__sub" id="cabecera-local">Panel del local</span>
      </span>
    </a>
    <a class="sm-btn sm-btn--borde sm-btn--chico" href="../comensal/restaurante.html"><span data-icono="eye" data-tamano="16"></span>Ver como comensal</a>
  </header>

  <main id="contenido" class="panel-contenido" tabindex="-1"></main>

  <!-- Navegación inferior (teléfono) -->
  <nav class="panel-nav-inferior" aria-label="Secciones">
    <a href="#inicio" data-ruta="inicio"><span class="burbuja" data-icono="inicio" data-tamano="21"></span>Inicio</a>
    <a href="#carta" data-ruta="carta"><span class="burbuja" data-icono="carta" data-tamano="21"></span>Carta</a>
    <a href="#ingredientes" data-ruta="ingredientes"><span class="burbuja" data-icono="ingredientes" data-tamano="21"></span>Ingredientes<span class="panel-cuenta panel-cuenta--flotante" data-cuenta="ingredientes" hidden></span></a>
    <a href="#promociones" data-ruta="promociones"><span class="burbuja" data-icono="promociones" data-tamano="21"></span>Promos</a>
    <a href="#local" data-ruta="local"><span class="burbuja" data-icono="local" data-tamano="21"></span>Local</a>
  </nav>
</div>

<dialog id="dialogo" class="sm-dialogo" aria-labelledby="dialogo-titulo"></dialog>
<div id="avisos" class="sm-avisos" role="status" aria-live="polite"></div>

<script src="../assets/js/iconos.js"></script>
<script src="../assets/js/datos-demo.js"></script>
<script src="local.js"></script>
</body>
</html>
