<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platos disponibles · SaborMap</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/componentes.css">
<link rel="stylesheet" href="comensal.css">
</head>
<body>
<div class="app app--platos">

  <header class="cm-cabecera">
    <a class="cm-cabecera__marca" href="explorar.html" aria-label="SaborMap, inicio">
      <span data-icono="logo" data-tamano="26"></span>
      <span class="cm-cabecera__nombre">SaborMap</span>
    </a>
    <button type="button" class="cm-cabecera__ubicacion">
      <span class="cm-ubicacion__icono" data-icono="nav" data-tamano="16"></span>
      Santiago Centro
      <span class="cm-ubicacion__chev" data-icono="chevDown" data-tamano="16"></span>
    </button>
    <a class="cm-cabecera__avatar" href="perfil.html" aria-label="Tu perfil"><img src="../assets/img/avatar.jpg" alt=""></a>
  </header>

  <div class="cm-pantalla" data-render="resultados">

    <div class="cm-buscador">
      <span class="cm-buscador__lupa" data-icono="search"></span>
      <label class="sm-visually-hidden" for="q-platos">Buscar un plato</label>
      <input class="cm-buscador__entrada" id="q-platos" type="search" placeholder="¿Qué se te antoja? Ej.: ramen, ceviche">
      <button type="button" class="cm-buscador__btn cm-buscador__btn--filtros" aria-label="Filtros">
        <span data-icono="filtros"></span>
      </button>
    </div>

    <div class="cm-chips" role="group" aria-label="Filtros de platos">
      <button type="button" class="sm-chip cm-chip--disponible">Solo disponibles</button>
      <button type="button" class="sm-chip">
        <span data-icono="promociones" data-tamano="16"></span>
        Con promoción
      </button>
      <button type="button" class="sm-chip">
        <span data-icono="nav" data-tamano="16"></span>
        &lt; 2 km
      </button>
      <button type="button" class="sm-chip">
        <span data-icono="star" data-tamano="16"></span>
        Mejor valorados
      </button>
    </div>

    <section class="cm-resumen" aria-label="Resumen de disponibilidad">
      <div class="cm-resumen__fila">
        <div class="cm-resumen__principal">
          <span class="cm-resumen__etiqueta">
            <span class="cm-resumen__vivo"><span data-icono="live" data-tamano="15"></span></span>
            SEMÁFORO DE PLATOS EN VIVO
          </span>
          <p class="cm-resumen__titular"><strong class="cm-resumen__acento" data-render="resumen-pct">84% de los platos</strong> están disponibles ahora</p>
          <p class="cm-resumen__detalle" data-render="cocinas">Según 4 cocinas activas a tu alrededor en Santiago Centro.</p>
        </div>
        <div class="cm-resumen__dona">
          <div class="cm-resumen__dona-grafico">
            <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="26" fill="none" stroke="#F0E6E0" stroke-width="7"></circle>
              <circle data-render="dona" cx="32" cy="32" r="26" fill="none" stroke="#006C49" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="26.1"></circle>
            </svg>
            <span class="cm-resumen__dona-valor" data-render="dona-valor">84%</span>
          </div>
          <span class="cm-resumen__dona-nota">Alta disp.</span>
        </div>
      </div>
      <div class="cm-resumen__leyenda">
        <span class="cm-resumen__clave"><span class="cm-punto cm-punto--verde"></span>Disponible</span>
        <span class="cm-resumen__clave"><span class="cm-punto cm-punto--ambar"></span>Pocas unidades</span>
        <span class="cm-resumen__clave"><span class="cm-punto cm-punto--rojo"></span>Agotado</span>
      </div>
    </section>

    <div class="cm-listado__cabecera">
      <h2 class="cm-listado__titulo">Platos cerca de ti</h2>
      <span class="cm-listado__actualizado">
        <span data-icono="clock" data-tamano="14"></span>
        Actualizado hace 2 min
      </span>
    </div>

  </div>

  <nav class="cm-nav" aria-label="Navegación principal">
    <a class="cm-nav__item" href="explorar.html">
      <span class="cm-nav__burbuja"><span data-icono="mapa" data-tamano="21"></span></span>
      <span class="cm-nav__texto">Explorar</span>
    </a>
    <a class="cm-nav__item" href="platos.html" aria-current="page">
      <span class="cm-nav__burbuja"><span data-icono="utensils" data-tamano="21"></span></span>
      <span class="cm-nav__texto">Platos</span>
    </a>
    <a class="cm-nav__item" href="promociones.html">
      <span class="cm-nav__burbuja"><span data-icono="promociones" data-tamano="21"></span></span>
      <span class="cm-nav__texto">Promos</span>
    </a>
    <a class="cm-nav__item" href="perfil.html#guardados">
      <span class="cm-nav__burbuja"><span data-icono="guardar" data-tamano="21"></span></span>
      <span class="cm-nav__texto">Guardados</span>
    </a>
    <a class="cm-nav__item" href="perfil.html">
      <span class="cm-nav__burbuja"><span data-icono="perfil" data-tamano="21"></span></span>
      <span class="cm-nav__texto">Perfil</span>
    </a>
  </nav>

</div>
<script src="../assets/js/datos-demo.js"></script>
<script src="../assets/js/db.js"></script>
<script src="render.js"></script>
<script src="../assets/js/iconos.js"></script>
<script>
  SaborMapDB.listo().then(function () {
    SaborMapRender.platos();
    SaborMapIconos.pintar();
  });
</script>
</body>
</html>
