<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detalle del plato · SaborMap</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/componentes.css">
<link rel="stylesheet" href="comensal.css">
</head>
<body>
<div class="app app--plato">

  <header class="cm-barra">
    <a class="cm-barra__volver" data-render="volver" href="restaurante.html" aria-label="Volver">
      <span data-icono="arrowLeft" data-tamano="22"></span>
    </a>
    <div class="cm-barra__textos">
      <h1 class="cm-barra__titulo" data-render="barra-titulo">Cargando…</h1>
      <p class="cm-barra__subtitulo" data-render="barra-subtitulo"></p>
    </div>
    <div class="cm-barra__acciones">
      <button type="button" class="cm-btn-icono" aria-label="Compartir plato">
        <span data-icono="share" data-tamano="20"></span>
      </button>
    </div>
  </header>

  <div class="cm-detalle__principal">
    <div class="cm-foto-detalle">
      <img data-render="hero" src="../assets/img/diavola.jpg" alt="">
      <div class="cm-foto-detalle__bandas" data-render="bandas"></div>
      <button type="button" class="cm-foto-detalle__favorito" data-guardar="" aria-label="Guardar en favoritos">
        <span data-icono="corazon"></span>
      </button>
    </div>

    <div class="cm-encabezado-plato">
      <h2 class="cm-encabezado__titulo" data-render="nombre"></h2>
      <div class="cm-precios-plato" data-render="precios"></div>
      <p class="cm-encabezado-plato__nota">Precio de referencia publicado por el restaurante.</p>
    </div>

    <a class="cm-enlace-local" data-render="enlace-local" href="restaurante.html">
      <span class="cm-promo__icono"><span data-icono="local" data-tamano="22"></span></span>
      <span class="cm-enlace-local__textos">
        <span class="cm-enlace-local__nombre" data-render="enlace-nombre"></span>
        <span class="cm-enlace-local__sub" data-render="enlace-sub"></span>
      </span>
      <span class="cm-enlace-local__chev" data-icono="chevRight"></span>
    </a>

    <section class="cm-aviso-disponibilidad" data-render="disponibilidad" aria-label="Disponibilidad"></section>

    <section class="cm-seccion-plato" data-render="caracteristicas-wrap" aria-label="Características">
      <div class="cm-seccion__cabecera">
        <h2 class="cm-seccion-plato__titulo">Características</h2>
      </div>
      <div class="cm-atributos" data-render="caracteristicas"></div>
    </section>

    <section class="cm-preparacion" aria-label="Preparación">
      <h2 class="cm-seccion-plato__titulo cm-titulo-con-icono">
        <span data-icono="utensils"></span>
        Preparación
      </h2>
      <p class="cm-preparacion__texto" data-render="preparacion"></p>
    </section>
  </div>

  <div class="cm-detalle__contenido">
    <div class="cm-acciones-plato">
      <button type="button" class="sm-btn sm-btn--primario sm-btn--grande" data-guardar="">
        <span data-icono="guardar"></span>
        Guardar en favoritos
      </button>
      <div class="cm-acciones-plato__fila">
        <button type="button" class="sm-btn sm-btn--secundario cm-btn-con-icono-marca">
          <span data-icono="destino" data-tamano="18"></span>
          Cómo llegar
        </button>
        <button type="button" class="sm-btn sm-btn--secundario cm-btn-con-icono-marca">
          <span data-icono="campana" data-tamano="18"></span>
          Avisarme
        </button>
      </div>
      <a class="sm-btn sm-btn--texto" data-render="carta-link" href="restaurante.html">
        <span data-render="carta-link-texto"></span>
        <span data-icono="arrowRight" data-tamano="16"></span>
      </a>
    </div>
  </div>

</div>
<script src="../assets/js/datos-demo.js"></script>
<script src="../assets/js/db.js"></script>
<script src="render.js"></script>
<script src="../assets/js/iconos.js"></script>
<script>
  SaborMapDB.listo().then(function () {
    SaborMapRender.plato();
    SaborMapIconos.pintar();
  });
</script>
</body>
</html>
