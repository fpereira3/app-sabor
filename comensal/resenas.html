<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reseñas y fotos · SaborMap</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/componentes.css">
<link rel="stylesheet" href="comensal.css">
</head>
<body>
<div class="app app--resenas">

  <header class="cm-barra">
    <a class="cm-barra__volver" href="restaurante.html" aria-label="Volver">
      <span data-icono="arrowLeft" data-tamano="22"></span>
    </a>
    <div class="cm-barra__textos">
      <h1 class="cm-barra__titulo">Reseñas y fotos</h1>
      <p class="cm-barra__subtitulo">La Trattoria del Sol · 4.8 (342 reseñas)</p>
    </div>
    <div class="cm-barra__acciones">
      <button type="button" class="cm-btn-icono" aria-label="Compartir">
        <span data-icono="share" data-tamano="20"></span>
      </button>
    </div>
  </header>

  <div class="cm-pantalla cm-pantalla--resenas">

    <div class="cm-resenas-local">
      <span class="cm-resenas-local__kicker">LA TRATTORIA DEL SOL</span>
      <span class="cm-resenas-local__sub">Barrio Italia · Italiana</span>
    </div>

    <section class="cm-valoraciones" aria-label="Resumen de valoraciones">
      <div class="cm-valoraciones__fila">
        <div class="cm-valoraciones__media">
          <span class="cm-valoraciones__nota">4.8</span>
          <span class="cm-valoraciones__estrellas">
            <span class="cm-estrella" data-icono="star" data-tamano="12"></span>
            <span class="cm-estrella" data-icono="star" data-tamano="12"></span>
            <span class="cm-estrella" data-icono="star" data-tamano="12"></span>
            <span class="cm-estrella" data-icono="star" data-tamano="12"></span>
            <span class="cm-estrella" data-icono="star" data-tamano="12"></span>
          </span>
          <span class="cm-valoraciones__total">342 reseñas</span>
        </div>
        <div class="cm-valoraciones__barras">
          <div class="cm-barra-estrella">
            <span>5</span>
            <span class="cm-barra-estrella__pista"><span class="cm-barra-estrella__lleno" style="width: 82%;"></span></span>
            <span>82%</span>
          </div>
          <div class="cm-barra-estrella">
            <span>4</span>
            <span class="cm-barra-estrella__pista"><span class="cm-barra-estrella__lleno" style="width: 12%;"></span></span>
            <span>12%</span>
          </div>
          <div class="cm-barra-estrella">
            <span>3</span>
            <span class="cm-barra-estrella__pista"><span class="cm-barra-estrella__lleno" style="width: 4%;"></span></span>
            <span>4%</span>
          </div>
          <div class="cm-barra-estrella">
            <span>2</span>
            <span class="cm-barra-estrella__pista"><span class="cm-barra-estrella__lleno" style="width: 1%;"></span></span>
            <span>1%</span>
          </div>
          <div class="cm-barra-estrella">
            <span>1</span>
            <span class="cm-barra-estrella__pista"><span class="cm-barra-estrella__lleno" style="width: 1%;"></span></span>
            <span>1%</span>
          </div>
        </div>
      </div>
      <div class="cm-valoraciones__stats">
        <span class="cm-stat cm-stat--verificada">
          <span data-icono="escudo" data-tamano="15"></span>
          100% visitas verificadas
        </span>
        <span class="cm-stat cm-stat--semaforo">
          <span data-icono="live" data-tamano="15"></span>
          96% dice que el semáforo fue preciso
        </span>
      </div>
    </section>

    <section class="cm-seccion cm-seccion--sin-margen" aria-label="Galería de fotos">
      <div class="cm-seccion__cabecera">
        <h2 class="cm-seccion-plato__titulo">Galería <span class="cm-cuenta-badge">148 fotos</span></h2>
        <a class="cm-plato__detalle" href="#galeria">Ver todas <span data-icono="chevRight" data-tamano="16"></span></a>
      </div>
      <div class="cm-galeria" id="galeria">
        <figure class="cm-galeria__figura">
          <img src="../assets/img/ambiente.jpg" alt="Ambiente interior">
          <figcaption class="cm-galeria__pie">
            <span class="cm-galeria__titulo">Salón</span>
            <span class="cm-galeria__sub">Ambiente interior</span>
          </figcaption>
        </figure>
        <figure class="cm-galeria__figura">
          <img src="../assets/img/fettuccine.jpg" alt="Fettuccine con burrata">
          <figcaption class="cm-galeria__pie">
            <span class="cm-galeria__titulo">Platos servidos</span>
            <span class="cm-galeria__sub">Fettuccine con burrata</span>
          </figcaption>
        </figure>
        <figure class="cm-galeria__figura">
          <img src="../assets/img/rev2.jpg" alt="Lasaña y focaccia">
          <figcaption class="cm-galeria__pie">
            <span class="cm-galeria__titulo">Mesa compartida</span>
            <span class="cm-galeria__sub">Lasaña y focaccia</span>
          </figcaption>
        </figure>
      </div>
    </section>

    <div class="cm-chips" role="group" aria-label="Filtros de reseñas">
      <button type="button" class="sm-chip" aria-pressed="true">
        <span data-icono="check" data-tamano="16"></span>
        Todas (342)
      </button>
      <button type="button" class="sm-chip">
        <span data-icono="camera" data-tamano="16"></span>
        Con fotos (128)
      </button>
      <button type="button" class="sm-chip">
        <span data-icono="utensils" data-tamano="16"></span>
        Platos
      </button>
      <button type="button" class="sm-chip">
        <span data-icono="ingredientes" data-tamano="16"></span>
        Ambiente
      </button>
    </div>

    <div class="cm-resenas" data-render="resenas"></div>

    <button type="button" class="sm-btn sm-btn--primario sm-btn--grande">
      <span data-icono="pencil"></span>
      Escribir una reseña
    </button>

  </div>

</div>
<script src="../assets/js/datos-demo.js"></script>
<script src="../assets/js/db.js"></script>
<script src="render.js"></script>
<script src="../assets/js/iconos.js"></script>
<script>
  SaborMapDB.listo().then(function () {
    SaborMapRender.resenas();
    SaborMapIconos.pintar();
  });
</script>
</body>
</html>
